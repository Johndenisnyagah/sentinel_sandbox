services:
  - type: web
    name: sentinel-sandbox-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ALLOWED_ORIGINS
        value: "https://sentinel-sanbox.vercel.app" # frontend URL; also checked on the WebSocket
